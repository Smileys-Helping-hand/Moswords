<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030014">
  <title>Moswords</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #030014;
      color: #f5f5fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    
    .container {
      text-align: center;
      max-width: 400px;
    }
    
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #a259ff 0%, #00f0ff 100%);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      color: white;
      box-shadow: 0 8px 32px rgba(162, 89, 255, 0.4);
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #a259ff 0%, #00f0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p {
      font-size: 16px;
      color: #b0b0c0;
      margin-bottom: 40px;
      line-height: 1.6;
    }
    
    .loading {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(162, 89, 255, 0.2);
      border-top: 4px solid #a259ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #808090;
    }
    
    .error {
      background: rgba(255, 59, 59, 0.1);
      border: 1px solid rgba(255, 59, 59, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      color: #ff3b3b;
    }
    
    .btn {
      background: linear-gradient(135deg, #a259ff 0%, #00f0ff 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      min-height: 48px;
      min-width: 48px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">M</div>
    <h1>Moswords</h1>
    <p>Professional Team Communication</p>
    <div class="loading"></div>
    <div class="status" id="status">Connecting to server...</div>
    <div id="error" style="display: none;" class="error"></div>
    <button id="retry-btn" class="btn" style="display: none;">Retry Connection</button>
  </div>

  <script>
    // Server candidates — tried in order. First one that responds wins.
    const SERVERS = [
      'http://192.168.31.217:3000',       // Local dev server (same WiFi)
      'http://localhost:3000',             // Emulator / USB-forwarded
      'https://moswords.vercel.app',       // Production deployment (always available)
    ];

    const statusEl = document.getElementById('status');
    const errorEl  = document.getElementById('error');
    const retryBtn = document.getElementById('retry-btn');
    let   attempt  = 0;

    async function tryServer(url) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4000); // 4 s timeout per server
      try {
        const res = await fetch(url + '/api/health', {
          signal: controller.signal,
          cache: 'no-store',
        });
        clearTimeout(timer);
        return res.ok;
      } catch (_) {
        clearTimeout(timer);
        return false;
      }
    }

    async function connect() {
      errorEl.style.display = 'none';
      retryBtn.style.display = 'none';
      attempt++;

      for (let i = 0; i < SERVERS.length; i++) {
        const url = SERVERS[i];
        statusEl.textContent = `Connecting… (${url.replace('http://','').replace('https://','').split('/')[0]})`;
        const ok = await tryServer(url);
        if (ok) {
          statusEl.textContent = 'Connected! Loading app…';
          window.location.replace(url);
          return;
        }
      }

      // All servers failed
      statusEl.textContent = 'Cannot reach any server';
      errorEl.innerHTML =
        '<b>No connection</b><br>' +
        'Make sure your PC is running <code>npx next dev</code> and the phone is on the same WiFi,<br>' +
        'or deploy the app to <b>Vercel</b> for always-on access.';
      errorEl.style.display = 'block';
      retryBtn.style.display = 'inline-block';
    }

    retryBtn.addEventListener('click', connect);
    connect();

    // Auto-retry every 8 seconds while offline
    setInterval(() => {
      if (errorEl.style.display !== 'none') connect();
    }, 8000);
  </script>
</body>
</html>
